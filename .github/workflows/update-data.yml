name: 대회 데이터 자동수집

on:
  schedule:
    # GitHub cron은 UTC 기준: 21:00 UTC=한국 06:00, 09:00 UTC=한국 18:00
    - cron: '0 9,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: park-golf-data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: 수집 도구 설치
        run: pip install -r requirements.txt

      - name: 공식 출처 수집 및 기존 데이터 병합
        run: python scripts/collect.py

      - name: 데이터 형식 검증
        run: python scripts/validate_data.py

      - name: 자동 테스트
        run: pytest -q

      - name: 변경된 데이터만 저장
        shell: bash
        run: |
          if git diff --quiet -- public/data/events.json data/geocode_cache.json; then
            echo "대회 데이터 변경이 없습니다."
            exit 0
          fi
          git config user.name "park-golf-finder bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/events.json data/geocode_cache.json
          git commit -m "data: 대회 정보 자동 갱신"
          git push
